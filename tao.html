<!doctype html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Một điều bất ngờ</title>
	<style>
		:root {
			--paper: #fff8ef;
			--ink: #2d2434;
			--plum: #4d254d;
			--coral: #ec6b58;
			--gold: #f3bd52;
			--mint: #b9ddd2;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			overflow-x: hidden;
			display: grid;
			place-items: center;
			color: var(--ink);
			font-family: Georgia, 'Times New Roman', serif;
			background:
				radial-gradient(circle at 8% 16%, #f3bd5240 0 4rem, transparent 4.1rem),
				radial-gradient(circle at 92% 86%, #b9ddd270 0 7rem, transparent 7.1rem),
				linear-gradient(135deg, #fff8ef 0%, #f7e4d0 48%, #e4eee8 100%);
		}

		.page {
			width: min(92vw, 760px);
			padding: 3rem 1.4rem;
			text-align: center;
			animation: rise .8s ease both;
		}

		.kicker {
			margin: 0 0 .75rem;
			color: var(--coral);
			font: 700 .76rem/1.2 system-ui, sans-serif;
			letter-spacing: .18em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			color: var(--plum);
			font-size: clamp(3.4rem, 11vw, 7rem);
			font-weight: 400;
			line-height: .9;
		}

		.intro {
			max-width: 31rem;
			margin: 1.4rem auto 1.7rem;
			font: 1.05rem/1.65 system-ui, sans-serif;
		}

		label {
			display: block;
			margin-bottom: .5rem;
			font: 700 .8rem/1.2 system-ui, sans-serif;
			letter-spacing: .08em;
			text-transform: uppercase;
		}

		input {
			width: min(100%, 280px);
			padding: .85rem 1rem;
			border: 2px solid #4d254d22;
			border-radius: 5px;
			outline: none;
			color: var(--ink);
			background: #ffffffa8;
			font: 1rem system-ui, sans-serif;
			text-align: center;
		}

		input:focus { border-color: var(--coral); }

		.gift-button {
			display: block;
			width: 220px;
			height: 220px;
			margin: 2.4rem auto 0;
			border: 0;
			position: relative;
			cursor: pointer;
			background: transparent;
			filter: drop-shadow(0 18px 16px #4d254d2b);
			transition: transform .2s ease;
		}

		.gift-button:hover { transform: translateY(-8px) rotate(-2deg); }
		.gift-button:active { transform: translateY(2px) scale(.96); }

		.box, .lid { position: absolute; left: 50%; transform: translateX(-50%); }
		.box {
			bottom: 21px;
			width: 160px;
			height: 112px;
			border-radius: 4px 4px 14px 14px;
			background: var(--coral);
		}

		.box::after, .lid::after {
			content: '';
			position: absolute;
			top: 0;
			left: 50%;
			width: 28px;
			height: 100%;
			transform: translateX(-50%);
			background: var(--gold);
		}

		.lid {
			bottom: 119px;
			width: 184px;
			height: 34px;
			border-radius: 7px;
			background: #d9524d;
			transition: transform .65s cubic-bezier(.2, 1.5, .4, 1), bottom .65s cubic-bezier(.2, 1.5, .4, 1);
			z-index: 2;
		}

		.lid::after { background: var(--gold); }
		.bow { position: absolute; z-index: 3; top: -25px; left: 50%; width: 38px; height: 38px; border: 10px solid var(--gold); border-radius: 50%; transform: translateX(-50%) rotate(45deg); }
		.bow::before, .bow::after { content: ''; position: absolute; width: 35px; height: 22px; border: 10px solid var(--gold); border-radius: 50%; top: -10px; }
		.bow::before { right: 12px; transform: rotate(-45deg); }
		.bow::after { left: 12px; transform: rotate(45deg); }

		.hint { margin-top: .4rem; color: #6d5865; font: .84rem system-ui, sans-serif; }

		.reveal {
			position: fixed;
			inset: 0;
			display: grid;
			place-items: center;
			padding: 1.5rem;
			opacity: 0;
			pointer-events: none;
			background: #2d2434e8;
			transition: opacity .45s ease;
			z-index: 10;
		}

		.reveal.open { opacity: 1; pointer-events: auto; }
		.letter { max-width: 620px; padding: 3.2rem 2rem; color: var(--ink); background: var(--paper); box-shadow: 16px 16px 0 var(--gold); transform: translateY(35px) rotate(2deg); transition: transform .65s cubic-bezier(.2, 1.3, .4, 1); }
		.open .letter { transform: translateY(0) rotate(-1deg); }
		.letter-mark { color: var(--coral); font-size: 3rem; }
		h2 { margin: .8rem 0 1rem; color: var(--plum); font-size: clamp(2.2rem, 7vw, 4.5rem); font-weight: 400; line-height: .95; }
		.letter p { margin: 0 auto 1.7rem; max-width: 30rem; font: 1.05rem/1.7 system-ui, sans-serif; }

		.close { border: 0; border-bottom: 2px solid var(--coral); padding: .5rem .2rem; color: var(--plum); background: transparent; cursor: pointer; font: 700 .9rem system-ui, sans-serif; }
		.close:hover { color: var(--coral); }

		.confetti { position: fixed; top: -20px; width: 10px; height: 22px; animation: drop 2.4s linear forwards; z-index: 20; }
		@keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
		@keyframes drop { to { transform: translate(var(--drift), 110vh) rotate(720deg); opacity: 0; } }
		@media (max-width: 480px) { .gift-button { margin-top: 1.8rem; transform: scale(.86); } .gift-button:hover { transform: scale(.86) translateY(-8px); } .letter { padding: 2.4rem 1.3rem; } }
	</style>
</head>
<body>
	<main class="page">
		<p class="kicker">Một tin nhắn nhỏ</p>
		<h1>Đừng bấm.</h1>
		<p class="intro">Có một món quà đang đợi ở đây. Nhưng chỉ dành cho người đủ tò mò.</p>
		<label for="name">Tên người nhận</label>
		<input id="name" type="text" placeholder="Nhập tên vào đây..." maxlength="30">
		<button class="gift-button" id="gift" type="button" aria-label="Mở món quà">
			<span class="lid"><span class="bow"></span></span>
			<span class="box"></span>
		</button>
		<p class="hint">Chạm vào hộp quà để mở</p>
	</main>

	<section class="reveal" id="reveal" aria-hidden="true">
		<article class="letter">
			<div class="letter-mark" aria-hidden="true">✦</div>
			<h2 id="title">Bất ngờ chưa?</h2>
			<p>Chúc bạn luôn có thật nhiều lý do để mỉm cười. Và hôm nay, lý do đó là bạn.</p>
			<button class="close" id="close" type="button">Đóng món quà lại</button>
		</article>
	</section>

	<script>
		const gift = document.querySelector('#gift');
		const reveal = document.querySelector('#reveal');
		const title = document.querySelector('#title');
		const name = document.querySelector('#name');
		const close = document.querySelector('#close');
		const colors = ['#ec6b58', '#f3bd52', '#b9ddd2', '#4d254d'];

		function makeConfetti() {
			for (let index = 0; index < 48; index += 1) {
				const piece = document.createElement('i');
				piece.className = 'confetti';
				piece.style.left = `${Math.random() * 100}vw`;
				piece.style.background = colors[index % colors.length];
				piece.style.setProperty('--drift', `${(Math.random() - .5) * 180}px`);
				piece.style.animationDelay = `${Math.random() * .35}s`;
				document.body.append(piece);
				window.setTimeout(() => piece.remove(), 2800);
			}
		}

		gift.addEventListener('click', () => {
			const recipient = name.value.trim();
			title.textContent = recipient ? `Dành cho ${recipient}` : 'Bất ngờ chưa?';
			reveal.classList.add('open');
			reveal.setAttribute('aria-hidden', 'false');
			makeConfetti();
			close.focus();
		});

		close.addEventListener('click', () => {
			reveal.classList.remove('open');
			reveal.setAttribute('aria-hidden', 'true');
			gift.focus();
		});

		reveal.addEventListener('click', (event) => {
			if (event.target === reveal) close.click();
		});
	</script>
</body>
</html>
